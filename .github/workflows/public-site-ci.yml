name: Public site CI

on:
  pull_request:
    paths:
      - "public-site/**"
      - ".github/workflows/public-site-ci.yml"
  push:
    branches:
      - "feature/nu-public-site-map-clean"
    paths:
      - "public-site/**"
      - ".github/workflows/public-site-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: public-site/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
